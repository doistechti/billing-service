spring:
  application:
    name: billing-service
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5433}}/${DB_NAME:${POSTGRES_DB:billing_service}}}}
    username: ${DB_USERNAME:${DATABASE_USERNAME:${DB_USER:${POSTGRES_USER:postgres}}}}
    password: ${DB_PASSWORD:${DATABASE_PASSWORD:${POSTGRES_PASSWORD:postgres}}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:public}
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    create-schemas: true

server:
  error:
    include-message: always

logging:
  level:
    com.doistech.billingservice: INFO
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://billing-service-billing-service-portal.moftjl.easypanel.host,http://localhost:4173,http://127.0.0.1:4173}
  security:
    api-key-header: X-API-Key
    # Chave do merchant legacy (sistemas clientes anteriores). Sem valor, o merchant legacy fica sem acesso por API key.
    api-key: ${INTERNAL_API_KEY:}
    admin-api-key-header: X-Admin-Key
    # Habilita /api/admin/merchants. Sem valor, a administração fica desabilitada.
    admin-api-key: ${ADMIN_API_KEY:}
    # 32 bytes em Base64 para cifrar credenciais dos merchants (openssl rand -base64 32). Obrigatória.
    encryption-key: ${BILLING_ENCRYPTION_KEY:}
  callbacks:
    enabled: ${CALLBACKS_ENABLED:true}
    poll-interval: ${CALLBACKS_POLL_INTERVAL:PT10S}
    max-attempts: ${CALLBACKS_MAX_ATTEMPTS:8}
    batch-size: ${CALLBACKS_BATCH_SIZE:20}
    initial-backoff: ${CALLBACKS_INITIAL_BACKOFF:PT30S}
    timeout: ${CALLBACKS_TIMEOUT:PT10S}

mercado-pago:
  base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
  # Credenciais do merchant legacy. Os demais merchants guardam as próprias credenciais no banco.
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
  public-key: ${MERCADO_PAGO_PUBLIC_KEY:}
  webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
  sandbox: ${MERCADO_PAGO_SANDBOX:false}
  webhook-base-url: ${APP_BASE_URL:http://localhost:8080}
  notification-url: ${APP_BASE_URL:http://localhost:8080}/api/webhooks/mercado-pago
